<style>
:root{--ink:#12263A;--brick:#D9531E;--paper:#F4F5F2;--white:#fff;--line:#D5D9DC;--mute:#4D5B68;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#F1F3F4;--paper:#0E1A27;--white:#16273A;--line:#2C4157;--mute:#A9B6C1;--brick:#F0733F}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:640px;margin:0 auto;padding:0 20px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,9vw,3.2rem);font-weight:800}
h2{font-size:1.65rem;font-weight:600;margin-bottom:14px}
header{padding:18px 0}
.logo{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.25rem}
.hero{padding:18px 0 40px}
.hero p.lead{margin:18px 0 24px;font-size:1.1rem;color:var(--mute)}
.btn{display:block;text-align:center;background:var(--brick);color:#fff;font-weight:600;font-size:1.1rem;padding:16px 20px;border-radius:4px;text-decoration:none;min-height:52px}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{font-size:.9rem;color:var(--mute);margin-top:10px}
.rep{background:var(--white);border:1px solid var(--line);border-top:6px solid var(--brick);margin-top:34px;padding:18px}
.rep .h{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.rep .t{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.2rem;color:var(--ink)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.9rem;line-height:1.1}
.g span{font-size:.88rem;color:var(--mute)}
.rep .f{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:.88rem;color:var(--mute)}
section{padding:36px 0;border-top:1px solid var(--line)}
section p+p{margin-top:12px}
ul.b{list-style:none;padding:0;display:grid;gap:18px}
ul.b li{padding-left:16px;border-left:4px solid var(--brick)}
ul.b strong{display:block}
.offer{background:var(--white);border:1px solid var(--line);padding:22px;margin-top:6px}
.offer .px{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:3rem;line-height:1}
.offer .px small{font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:1rem;color:var(--mute)}
.offer p{margin:10px 0}
.gar{border-left:4px solid var(--ink);padding-left:12px;margin:16px 0}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details p{margin-top:6px;color:var(--mute)}
footer{padding:28px 0 40px;border-top:1px solid var(--line);font-size:.9rem;color:var(--mute)}
footer a{color:inherit;display:inline-block;padding:8px 14px 8px 0}
